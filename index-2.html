<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cloud Escape | Cloud in Bahrain</title>
<style>
:root{--bg:#06172d;--panel:#0d2948;--cyan:#54d9ff;--muted:#b6cde0;--green:#54e0ae}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0%,#164b77,#071c35 48%,#041020);color:#f4fbff;font-family:Arial,sans-serif;min-height:100vh}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:13px 18px;font-weight:700}.primary{background:linear-gradient(135deg,#39c8f2,#2679dc);color:#03172c}.secondary{background:#173c60;color:white;border:1px solid #36729d}
.wrap{max-width:1000px;margin:auto;padding:20px}.top,.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.brand,.tag{color:var(--cyan);font-weight:900;letter-spacing:2px;font-size:13px}.pill{border:1px solid #2d6a91;border-radius:99px;padding:8px 12px;color:var(--muted)}
.hero,.panel{background:linear-gradient(145deg,#10375beF,#091e37f5);border:1px solid #28618a;border-radius:24px;box-shadow:0 18px 55px #0006;padding:clamp(22px,5vw,48px);margin:28px 0}
.hero{text-align:center;position:relative;overflow:hidden}.hero:before{content:"☁";position:absolute;font-size:220px;opacity:.05;right:3%;top:-60px}
h1{font-size:clamp(36px,7vw,64px);margin:14px 0 6px}h2{font-size:clamp(23px,4vw,34px)}.subtitle{color:var(--muted);line-height:1.65;font-size:17px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin:22px 0}.tile{background:#0b2542;border:1px solid #24577e;border-radius:16px;padding:16px;text-align:left}.tile b{display:block;margin:7px 0}.tile span,.small{font-size:13px;color:var(--muted)}.icon{font-size:32px}.progress{height:8px;background:#07172b;border-radius:20px;overflow:hidden;margin:16px 0}.progress div{height:100%;background:linear-gradient(90deg,#39d5f4,#3689ed)}
.question{font-size:clamp(19px,3vw,25px);line-height:1.45}.ar{display:block;color:#b9d5e9;font-size:.9em;margin-top:7px;direction:rtl}.answers{display:grid;grid-template-columns:1fr;gap:11px;margin:20px 0}.answer{width:100%;text-align:left;background:#14395d;color:white;border:1px solid #326d98;display:flex;gap:12px;align-items:center}.answer:disabled{opacity:.65}.letter{background:#071a30;color:var(--cyan);border-radius:8px;padding:8px 11px}.feedback{padding:14px;border-radius:12px;margin:14px 0;display:none;line-height:1.5}.good{background:#0b493d;border:1px solid #25b98e}.bad{background:#512438;border:1px solid #bd536d}.digit{font-size:42px;font-weight:900;letter-spacing:8px;color:var(--green);text-align:center;padding:12px}.codeboxes{display:flex;justify-content:center;gap:9px;margin:22px 0}.codeboxes input{width:54px;height:62px;border-radius:12px;border:1px solid #4385ad;background:#061a30;color:white;text-align:center;font-size:27px}.hidden{display:none!important}.footer{text-align:center;color:#8eacc4;font-size:12px;padding:22px}
@media(min-width:700px){.answers{grid-template-columns:1fr 1fr}}
</style></head><body><div class="wrap">
<div class="top"><div class="brand">☁ CLOUD IN BAHRAIN · TECHNO TEAM</div><div class="row"><span class="pill" id="timer">⏱ 00:00</span><button class="secondary" id="langBtn" onclick="toggleLang()">العربية</button></div></div>
<main id="app"></main><div class="footer">Explore. Connect. Innovate. · Supervised by A. Lamya Marei</div></div>
<script>
const rooms=[
{icon:"☁️",name:"THE S3 VAULT",ar:"خزنة التخزين السحابي",topic:"CLOUD STORAGE",topicAr:"التخزين السحابي",q:"Which of these is a cloud storage service?",qa:"أيٌّ مما يلي يُعد خدمة تخزين سحابي؟",opts:["Google Drive","Calculator","Keyboard","Paint"],optsAr:["Google Drive","الآلة الحاسبة","لوحة المفاتيح","برنامج الرسام"],correct:0,digit:"4",why:"Google Drive stores files online so you can access them from supported devices.",whyAr:"يخزّن Google Drive الملفات عبر الإنترنت لتتمكني من الوصول إليها من أجهزتك."},
{icon:"🌐",name:"THE NETWORK GATE",ar:"بوابة الشبكة",topic:"CONNECTIVITY",topicAr:"الاتصال بالإنترنت",q:"What do you generally need to access an online cloud service?",qa:"ماذا تحتاجين عادةً للوصول إلى خدمة سحابية عبر الإنترنت؟",opts:["An internet connection","A printer","A keyboard only","A USB flash drive only"],optsAr:["اتصال بالإنترنت","طابعة","لوحة مفاتيح فقط","ذاكرة USB فقط"],correct:0,digit:"2",why:"An internet connection lets your device communicate with the cloud service.",whyAr:"يسمح اتصال الإنترنت لجهازك بالتواصل مع الخدمة السحابية."},
{icon:"🔐",name:"THE CIPHER CHAMBER",ar:"غرفة التشفير والأمان",topic:"CYBERSECURITY",topicAr:"الأمن السيبراني",q:"Which choice is the strongest password?",qa:"أي خيار يُعد كلمة المرور الأقوى؟",opts:["123456","school123","T3ch!Cloud#29","lamya"],optsAr:["123456","school123","T3ch!Cloud#29","lamya"],correct:2,digit:"7",why:"A long, unique password with mixed character types is harder to guess. Never reuse this example as a real password.",whyAr:"كلمة المرور الطويلة والفريدة التي تجمع أنواعاً مختلفة من الرموز أصعب في التخمين. لا تستخدمي هذا المثال ككلمة مرور حقيقية."},
{icon:"📡",name:"THE PACKET STORM",ar:"عاصفة حزم البيانات",topic:"DATA ACCESS",topicAr:"الوصول إلى البيانات",q:"Can you open a cloud file on another device?",qa:"هل يمكنك فتح ملف سحابي باستخدام جهاز آخر؟",opts:["Yes, with internet and authorized account access","No, only the first device can open it"],optsAr:["نعم، بوجود الإنترنت وتسجيل الدخول المصرّح به","لا، الجهاز الأول فقط يستطيع فتحه"],correct:0,digit:"9",why:"Cloud files can be accessed on different devices when you sign in and have permission.",whyAr:"يمكن الوصول إلى الملفات السحابية من أجهزة مختلفة عند تسجيل الدخول وامتلاك الصلاحية."}
];
let lang="en",stage="home",room=0,score=0,seconds=0,tick=null,unlocked=[];
const app=document.getElementById("app");
function toggleLang(){lang=lang==="en"?"ar":"en";document.getElementById("langBtn").textContent=lang==="en"?"العربية":"English";render()}
function startTimer(){if(tick)return;tick=setInterval(()=>{seconds++;document.getElementById("timer").textContent="⏱ "+String(Math.floor(seconds/60)).padStart(2,"0")+":"+String(seconds%60).padStart(2,"0")},1000)}
function stopTimer(){clearInterval(tick);tick=null}
function home(){stage="home";render()}
function start(){room=0;score=0;seconds=0;unlocked=[];document.getElementById("timer").textContent="⏱ 00:00";stage="brief";startTimer();render()}
function beginRooms(){stage="room";render()}
function answer(i){const r=rooms[room],fb=document.getElementById("feedback");if(i===r.correct){score+=10;unlocked[room]=r.digit;fb.className="feedback good";fb.style.display="block";fb.innerHTML=(lang==="en"?"✓ Correct! ":"✓ إجابة صحيحة! ")+(lang==="en"?r.why:r.whyAr)+"<br><b>"+(lang==="en"?"Secret digit: ":"الرقم السري: ")+r.digit+"</b>";document.getElementById("nextBtn").classList.remove("hidden");document.querySelectorAll(".answer").forEach(b=>b.disabled=true)}else{fb.className="feedback bad";fb.style.display="block";fb.textContent=lang==="en"?"Not quite! Try again.":"ليست الإجابة الصحيحة، حاولي مرة أخرى."}}
function next(){if(room<3){room++;render()}else{stage="lock";render()}}
function checkCode(){const val=[...document.querySelectorAll(".codeboxes input")].map(x=>x.value).join("");const fb=document.getElementById("lockFeedback");if(val==="4279"){stage="win";stopTimer();render()}else{fb.textContent=lang==="en"?"Incorrect code. Check your four digits and try again.":"الرمز غير صحيح. تحققي من الأرقام الأربعة وحاولي مرة أخرى.";fb.className="feedback bad";fb.style.display="block"}}
function render(){const ar=lang==="ar";
if(stage==="home"){app.innerHTML=`<section class="hero"><div class="tag">CLOUD IN BAHRAIN · INTERACTIVE ESCAPE ROOM</div><h1>☁ CLOUD ESCAPE</h1><h2>${ar?"افتحي بوابة السحابة!":"UNLOCK THE CLOUD!"}</h2><p class="subtitle">${ar?"أصبحتِ مهندسة سحابية في مهمة لإنقاذ نظام المدرسة. حلّي أربعة تحديات واجمعي الأرقام السرية لفتح بوابة السحابة.":"You are a Cloud Engineer on a mission to rescue the school's cloud system. Solve four challenges and collect the secret digits to unlock the cloud."}</p><div class="grid">${rooms.map((r,i)=>`<div class="tile"><div class="icon">${r.icon}</div><b>${ar?r.ar:r.name}</b><span>${ar?r.topicAr:r.topic}</span></div>`).join("")}</div><button class="primary" onclick="start()">${ar?"ابدئي المهمة ←":"START MISSION →"}</button><p class="small">${ar?"لعبة تعليمية: لا تدخلي كلمات مرور حقيقية أو بيانات شخصية.":"Educational game: never enter real passwords or personal information."}</p></section>`;return}
if(stage==="brief"){app.innerHTML=`<section class="panel"><div class="tag">MISSION BRIEFING · تعليمات المهمة</div><h2>${ar?"مهمتك":"YOUR MISSION"}</h2><p class="subtitle">${ar?"أمامك أربع غرف. أجيبي عن سؤال كل غرفة بشكل صحيح لتحصلي على رقم سري. اجمعي الأرقام بالترتيب ثم أدخلي الرمز النهائي.":"Four rooms stand between you and the cloud. Answer each room's question correctly to earn one secret digit. Collect the digits in order and enter the final code."}</p><div class="grid">${rooms.map((r,i)=>`<div class="tile"><div class="icon">${r.icon}</div><b>${ar?r.ar:r.name}</b><span>${ar?"التحدي":"Challenge"} ${i+1}</span></div>`).join("")}</div><button class="primary" onclick="beginRooms()">${ar?"دخول الغرفة الأولى":"ENTER ROOM 1 →"}</button></section>`;return}
if(stage==="room"){const r=rooms[room];app.innerHTML=`<section class="panel"><div class="row"><span class="tag">ROOM ${room+1} / 4 · ${ar?r.topicAr:r.topic}</span><span class="pill">${ar?"النقاط":"SCORE"}: ${score}</span></div><div class="progress"><div style="width:${(room+1)*25}%"></div></div><div class="icon" style="font-size:55px;text-align:center">${r.icon}</div><h2 style="text-align:center">${ar?r.ar:r.name}</h2><p class="question">${ar?r.qa:r.q}<span class="ar">${ar?r.q:r.qa}</span></p><div class="answers">${(ar?r.optsAr:r.opts).map((o,i)=>`<button class="answer" onclick="answer(${i})"><span class="letter">${String.fromCharCode(65+i)}</span>${o}</button>`).join("")}</div><div id="feedback" class="feedback"></div><div class="row"><span class="small">${ar?"اختاري إجابة واحدة":"Choose one answer"}</span><button id="nextBtn" class="primary hidden" onclick="next()">${room===3?(ar?"الانتقال إلى القفل النهائي":"GO TO FINAL LOCK →"):(ar?"الغرفة التالية ←":"NEXT ROOM →")}</button></div></section>`;return}
if(stage==="lock"){app.innerHTML=`<section class="panel" style="text-align:center"><div class="icon">🔒</div><div class="tag">FINAL SECURITY GATE</div><h2>${ar?"أدخلي الرمز السري":"ENTER THE SECRET CODE"}</h2><p class="subtitle">${ar?"أدخلي الأرقام الأربعة التي جمعتها من الغرف بالترتيب.":"Enter the four digits you collected from the rooms, in order."}</p><div class="digit">${unlocked.join("  ")}</div><div class="codeboxes">${[1,2,3,4].map(()=>`<input inputmode="numeric" maxlength="1" aria-label="Code digit">`).join("")}</div><button class="primary" onclick="checkCode()">${ar?"فتح البوابة":"UNLOCK THE CLOUD"}</button><div id="lockFeedback" class="feedback"></div><p class="small">${ar?"تلميح: استخدمي الأرقام التي حصلتِ عليها من كل غرفة.":"Hint: use the digits earned in each room."}</p></section>`;return}
if(stage==="win"){app.innerHTML=`<section class="hero"><div class="tag">MISSION ACCOMPLISHED</div><div style="font-size:76px">🏆☁️</div><h1>${ar?"أحسنتِ!":"CONGRATULATIONS!"}</h1><h2>${ar?"لقد فتحتِ بوابة السحابة!":"YOU UNLOCKED THE CLOUD!"}</h2><p class="subtitle">${ar?"أصبحتِ الآن مستكشفة للحوسبة السحابية.":"You are now a Cloud Explorer."}</p><div class="grid"><div class="tile"><b>${ar?"النقاط":"SCORE"}</b><span>${score} / 40</span></div><div class="tile"><b>${ar?"الوقت":"TIME"}</b><span>${String(Math.floor(seconds/60)).padStart(2,"0")}:${String(seconds%60).padStart(2,"0")}</span></div></div><p class="small">CLOUD IN BAHRAIN · Explore. Connect. Innovate.</p><button class="primary" onclick="home()">${ar?"العودة للبداية":"PLAY AGAIN"}</button></section>`}}
render();
</script></body></html>
